<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SayDim</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button class="UpperButton" onclick="location.href='index.html'">
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        <span
          class="iconify"
          data-icon="lucide:stretch-horizontal"
          style="color: #fff; font-size: 24px"
        ></span>
      </button>
      <h1>SayDims</h1>
      <button class="UpperButton">
        <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
        />
        <i class="bi bi-plus-circle" style="color: #fff; font-size: 24px"></i>
      </button>
    </header>
    <main>
      <section class="CharDetails" aria-labelledby="char-name" data-id="1">
        <img
          class="CharMainImg"
          src="assets/eren.jpg"
          alt="Eren — Attack on Titan"
        />
        <h2 id="char-name" class="CharName">Eren</h2>
        <p class="CharDescription">El demonio de paradis</p>

        <table class="CharStats" aria-label="Detalles del personaje">
          <tbody>
            <tr>
              <th scope="row">Vida</th>
              <td>120 ❤️</td>
            </tr>
            <tr>
              <th scope="row">Dimensión</th>
              <td>Attack on Titan</td>
            </tr>
            <tr>
              <th>Creado</th>
              <td>10/11/25</td>
            </tr>
            <tr>
              <th>Comentarios</th>
              <td>Versión adulto</td>
            </tr>
          </tbody>
        </table>

        <h3>Habilidades ⚡</h3>
        <table class="Powers" aria-label="Poderes del personaje">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Daño</th>
              <th>Cooldown</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="PowerName">Rayo Solar</td>
              <td>35</td>
              <td>3s</td>
            </tr>
            <tr>
              <td class="PowerDescription" colspan="3">Golpe de luz</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <nav>
      <h3>Otras versiones del personaje</h3>
      <section class="CharList">
        <a href="vistachar.html" class="CharacterInList">
          <img class="CharImg" src="assets/eren.jpg" alt="Eren" />
          <p class="CharName">Eren Yeager</p>
        </a>
        <a href="vistachar.html" class="CharacterInList">
          <img class="CharImg" src="assets/eren.jpg" alt="Goku" />
          <p class="CharName">Goku</p>
        </a>
        <a href="vistachar.html" class="CharacterInList">
          <img class="CharImg" src="assets/eren.jpg" alt="Satoru Gojo" />
          <p class="CharName">Satoru Gojo</p>
        </a>
      </section>
    </nav>
  </body>
</html>
