<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agregar • SayDim</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="add">
    <header>
      <button class="UpperButton" onclick="history.back()" title="Volver">
        ⟵
      </button>
      <h1>Agregar</h1>
      <button
        class="UpperButton"
        onclick="location.href='index.html'"
        title="Inicio"
      >
        ⌂
      </button>
    </header>

    <main>
      <section class="CharDetails" id="dimension-section">
        <h2>Nueva dimensión</h2>
        <form id="dimForm" class="form">
          <input type="text" name="name" placeholder="Nombre" required />
          <textarea name="description" placeholder="Descripción"></textarea>
          <textarea name="history" placeholder="Historia"></textarea>
          <input type="file" name="image" accept="image/*" required />
          <small>La portada se ajustará a 16:9 automáticamente.</small>
          <button type="submit" class="UpperButton">Crear dimensión</button>
        </form>
      </section>

      <section class="CharDetails" id="character-section">
        <h2>Nuevo personaje</h2>
        <form id="charForm" class="form">
          <input type="text" name="nombre" placeholder="Nombre" required />
          <label>
            Dimensión:
            <select name="dimension" id="charDim" required></select>
          </label>
          <input type="number" name="vida" placeholder="Vida" />
          <textarea name="descripcion" placeholder="Descripción"></textarea>
          <input type="file" name="foto" accept="image/*" required />
          <small
            >La imagen se recortará a 1:1 y se comprimirá
            automáticamente.</small
          >
          <textarea
            name="powers"
            placeholder='Poderes (JSON array). Ej: [{"nombre":"Fuego","descripcion":"Arde","daño":10}]'
          ></textarea>
          <input
            type="text"
            name="comentarios"
            placeholder="Comentarios extra"
          />
          <button type="submit" class="UpperButton">Crear personaje</button>
        </form>
      </section>
    </main>

    <script>(function(){ if(location.protocol==='file:') window.SAYDIM_MOCK = true; })();</script>
    <script src="js/mock.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
